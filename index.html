<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Video Feed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage">
    <div class="player-wrap">
      <section id="videoCard" class="video-card">
        <div class="play-status">▶</div>
        <div class="video-meta">
          <div id="postHandle" class="handle"></div>
          <h2 id="postTitle" class="title"></h2>
          <p id="postDesc" class="desc"></p>
        </div>
      </section>

      <aside class="actions">
        <!-- Creator Avatar -->
        <div class="avatar-wrap">
          <div id="avatarInitial" class="avatar">P</div>
          <button id="followBtn" class="follow-badge" title="Follow">+</button>
        </div>

        <!-- Like -->
        <div class="action-item">
          <button id="likeBtn" class="circle-btn" aria-label="Like">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
          <span id="likeCount" class="action-count">0</span>
        </div>

        <!-- Comment -->
        <div class="action-item">
          <button id="commentBtn" class="circle-btn" aria-label="Comments">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
            </svg>
          </button>
          <span id="commentCount" class="action-count">0</span>
        </div>

        <!-- Save / Bookmark -->
        <div class="action-item">
          <button id="saveBtn" class="circle-btn" aria-label="Save">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
          </button>
          <span class="action-count">Save</span>
        </div>

        <!-- Share -->
        <div class="action-item">
          <button id="shareBtn" class="circle-btn" aria-label="Share">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/>
            </svg>
          </button>
          <span class="action-count">Share</span>
        </div>
      </aside>
    </div>

    <!-- Feed Navigation -->
    <div class="nav-btns">
      <button id="prevBtn" class="nav-btn" aria-label="Previous">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </button>
      <button id="nextBtn" class="nav-btn" aria-label="Next">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
