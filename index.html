<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic Video Feed</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="feed" class="feed"></main>

  <div class="nav-btns">
    <button id="prevBtn" class="nav-btn" aria-label="Previous">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
    <button id="nextBtn" class="nav-btn" aria-label="Next">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </div>

  <aside id="infoDrawer" class="info-drawer" aria-hidden="true">
    <section id="screenSummary" class="drawer-screen">
      <div class="info-header">
        <h2>Bias Information</h2>
        <button class="close-btn" id="closeDrawer" aria-label="Close">✕</button>
      </div>

      <div class="info-body">
        <div class="info-block">
          <h3>Why this post may be biased</h3>
          <p id="biasSummaryText"></p>
        </div>

        <div class="info-block">
          <h3>About the poster (<span id="posterHandle"></span>)</h3>
          <p id="posterNoteText"></p>
        </div>
      </div>

      <div class="info-footer">
        <div class="footer-row">
          <button id="editBtn" class="secondary-btn">Edit</button>
          <button id="moreInfoBtn" class="primary-btn">Additional Information ›</button>
        </div>
      </div>
    </section>

    <section id="screenEdit" class="drawer-screen hidden">
      <div class="info-header">
        <button id="cancelEditBtn" class="back-btn">Cancel</button>
        <h2 id="editHeaderTitle">Edit Information</h2>
        <button class="close-btn" id="closeDrawer3" aria-label="Close">✕</button>
      </div>

      <div class="info-body">
        <div class="info-block edit-block">
          <label for="editBiasSummary">Why this post may be biased</label>
          <textarea id="editBiasSummary" rows="5"></textarea>
        </div>

        <div class="info-block edit-block">
          <label for="editPosterNote">About the poster (<span id="editPosterHandle"></span>)</label>
          <textarea id="editPosterNote" rows="4"></textarea>
        </div>

        <p id="editConfirmNotice" class="edit-notice hidden">Review your edits above, then tap Save Changes to apply them.</p>
      </div>

      <div class="info-footer">
        <button id="finishEditBtn" class="primary-btn">Finish</button>
        <div id="saveActions" class="footer-row hidden">
          <button id="keepEditingBtn" class="secondary-btn">Keep Editing</button>
          <button id="saveChangesBtn" class="save-btn-action">Save Changes</button>
        </div>
      </div>
    </section>

    <section id="screenSources" class="drawer-screen hidden">
      <div class="info-header">
        <button id="backToSummary" class="back-btn">‹ Back</button>
        <h2>Additional Information</h2>
        <button class="close-btn" id="closeDrawer2" aria-label="Close">✕</button>
      </div>

      <div class="info-body">
        <p class="sources-intro">Explore independent sources and fact-checks on this topic:</p>
        <div id="sourcesList" class="sources-list"></div>
      </div>
    </section>
  </aside>

  <script src="app.js"></script>
</body>
</html>
